<title>Mercanti del Mediterraneo</title>
<style>
:root{--bg:#15110c;--card:#231b12;--ink:#f2e8cf;--mut:#b4a483;--gold:#e5bb5c;--line:#5b4627;--ok:#7fd28f;--bad:#f2837a;--btn:#46351d;--sel:#3a2c18;--hd:#0f0c08}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:15px/1.4 system-ui,sans-serif;background:var(--bg);color:var(--ink);overflow:hidden;position:fixed;left:0;top:0;right:0;bottom:0}
#app{position:absolute;left:0;top:0;width:100%;height:100%;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:'h' 'm' 'n';overflow:hidden;background:var(--bg)}
main{grid-area:m;overflow-y:auto;overflow-x:hidden;padding:10px;min-height:0;-webkit-overflow-scrolling:touch}
body.start nav,body.start .days{display:none}
h2{font:600 20px Georgia,serif;margin:6px 0 10px;color:var(--gold)}
header{grid-area:h;position:relative;background:var(--hd);border-bottom:1px solid var(--line);padding:8px 12px;z-index:5}
#top{font:600 17px Georgia,serif;color:var(--gold);display:flex;justify-content:space-between;gap:8px}
.days{display:flex;gap:6px;margin-top:6px}
.days button{flex:1;padding:7px 4px}
nav{grid-area:n;overflow-x:auto;display:flex;background:var(--hd);border-top:1px solid var(--line);z-index:5}
nav button{flex:1 1 0;min-width:0;background:none;border:0;color:var(--mut);padding:6px 1px 7px;font-size:10px;border-radius:0;min-height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;position:relative}
nav button i{font-style:normal;font-size:20px;line-height:1.1}
nav button b.dot{position:absolute;top:5px;left:calc(50% + 8px);width:9px;height:9px;border-radius:50%;background:#e2493a;border:1.5px solid var(--hd)}
nav button.on{background:none;color:var(--gold);box-shadow:inset 0 3px 0 var(--gold)}
button,select{font:inherit;color:var(--ink);background:var(--btn);border:1px solid var(--line);border-radius:8px;padding:9px 12px}
button:active{background:var(--line)}
button.on{background:var(--gold);color:#1a1405;border-color:var(--gold)}
select{width:100%;margin:4px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px}
.r{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.b{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.b button{flex:1;min-width:84px}
small,.m{color:var(--mut)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--card);margin-bottom:10px}
table{border-collapse:collapse;font-size:13px;width:100%}
td,th{padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:right}
th{color:var(--mut);font-weight:500}
td:first-child,th:first-child{text-align:left;position:sticky;left:0;background:var(--card)}
.lo{color:var(--ok);font-weight:700}.hi{color:var(--bad);font-weight:700}
#toast{position:absolute;left:50%;bottom:82px;transform:translateX(-50%);background:var(--gold);color:#1a1405;padding:8px 14px;border-radius:20px;opacity:0;transition:opacity .2s;z-index:9;max-width:90%;text-align:center;pointer-events:none}
.log p{margin:0;padding:6px 0;border-bottom:1px solid var(--line)}
input{font:inherit;width:100%;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px;margin:4px 0 10px}#bar{height:3px;background:var(--line);margin-top:6px;border-radius:2px;overflow:hidden}#bar i{display:block;height:100%;width:0;background:var(--gold)}#sub{font-size:12px;color:var(--mut)}body.start #bar,body.start #sub{display:none}
.pb{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:4px 0 8px}.pb i{display:block;height:100%;background:var(--gold)}button:disabled{opacity:.5}

.gear{flex:none;padding:2px 9px;font-size:17px;line-height:1.2}
#top .gear{margin-left:auto}
.mapwrap{display:block}
.mapbtns .b{margin:0 0 8px}
.mapbtns .b button{min-width:60px}
#mapbox{overflow:auto;max-height:var(--mh,50vh);border:1px solid var(--line);border-radius:10px;-webkit-overflow-scrolling:touch}
.leg{margin:8px 0}
#app.land{grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);grid-template-areas:'n h' 'n m'}
.land nav{flex-direction:column;overflow-x:hidden;overflow-y:auto;border-top:0;border-right:1px solid var(--line)}
.land nav button{flex:0 0 auto;flex-direction:row;justify-content:flex-start;gap:10px;padding:11px 16px;font-size:13px;min-height:0}
.land nav button b.dot{left:auto;right:10px;top:50%;margin-top:-5px}
.land nav button.on{box-shadow:inset 3px 0 0 var(--gold)}
.land header{display:flex;align-items:center;gap:14px;padding:6px 12px}
.land #top{flex:0 0 auto;gap:16px}
.land #top .gear{margin-left:6px}
.land #sub{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.land .days{margin-top:0;flex:0 0 auto}
.land .days button{flex:none;padding:6px 12px}
.land #bar{position:absolute;left:0;right:0;bottom:0;margin:0;height:3px}
.land #toast{bottom:16px}
.land main{padding:8px 12px}
.land .mapwrap{display:flex;gap:12px;height:100%}
.land .mapcol{flex:1.8;min-width:0;display:flex;flex-direction:column;height:100%}
.land .mapbtns{display:flex;align-items:center;gap:10px}
.land .mapbtns h2{margin:0 0 6px}
.land .mapbtns .b{margin:0 0 6px;flex:none}
.land .mapbtns .b button{flex:none;min-width:46px;padding:6px 12px}
.land #mapbox{flex:1;min-height:0;max-height:none}
.land .sidecol{flex:1;min-width:240px;overflow-y:auto;height:100%;padding-right:2px}
button,select{background:linear-gradient(#55411f,#3e2f18);border:1px solid #7a5f2f;border-radius:10px;min-height:42px;box-shadow:0 1px 0 rgba(255,225,150,.12) inset,0 2px 4px rgba(0,0,0,.35)}
button:active{background:#6a5126}
button.on{background:linear-gradient(#f0cb73,#d2a23f);color:#2a1d05;border-color:#f0cb73}
button:disabled{opacity:.45}
.card{background:linear-gradient(#2a2116,#211a11);border:1px solid var(--line);border-top:2px solid #8a6a30;border-radius:12px;box-shadow:0 3px 8px rgba(0,0,0,.35);padding:11px}
.tw{border-color:var(--line);border-radius:12px}
h2{letter-spacing:.3px;text-shadow:0 1px 0 #000}h2::after{content:'';display:block;height:1px;margin-top:4px;background:linear-gradient(90deg,var(--gold),transparent)}
input{background:#1b150d;border-color:#7a5f2f}
#toast{animation:none;box-shadow:0 4px 12px rgba(0,0,0,.5);transition:opacity .25s,transform .25s}
.gi{display:inline-block;width:1.4em;text-align:center}
.th2{display:block;font-size:17px;line-height:1.1}
.sb{height:5px;background:#120e08;border-radius:3px;overflow:hidden;margin:5px 0 3px;border:1px solid #3a2c18}.sb i{display:block;height:100%;background:linear-gradient(90deg,#b8862f,#e5bb5c)}
.sb.low i{background:#d4572f}.sb.high i{background:#5fae6a}
.pc{font-weight:700}.pc.cheap{color:var(--ok)}.pc.dear{color:var(--bad)}
.menubg{position:absolute;left:-10px;right:-10px;top:-10px;bottom:-10px;filter:blur(3px) brightness(.42) saturate(.9);background-size:cover!important;background-position:center!important;z-index:-1}
.menu{position:relative;min-height:100%;z-index:1;display:flex;flex-direction:column;justify-content:center;gap:12px;padding:20px 8px;max-width:460px;margin:0 auto}
.menu .tt{text-align:center;margin-bottom:10px}
.menu .tt div{font:700 30px/1.1 Georgia,serif;color:var(--gold);text-shadow:0 2px 6px #000,0 0 18px rgba(0,0,0,.8)}
.menu .tt small{color:#e9dcbb;text-shadow:0 1px 3px #000}
.menu .bigbtn{width:100%;padding:16px 12px;font:600 18px Georgia,serif;min-height:56px;letter-spacing:.3px}
.menu .bigbtn.pri{background:linear-gradient(#f0cb73,#cf9e3c);color:#2a1d05;border-color:#f6dc92}
.menu .sv{display:block;text-align:center;color:#e9dcbb;text-shadow:0 1px 3px #000;margin:-6px 0 2px;font-size:13px}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.6px)}}
@keyframes wk{to{stroke-dashoffset:-12}}
@keyframes pls{0%,100%{opacity:.9}50%{opacity:.2}}
@keyframes shine{0%{transform:translateX(-60%)}100%{transform:translateX(60%)}}
.bob{animation:bob 1.8s ease-in-out infinite}
.wake{animation:wk .8s linear infinite}
.pulse{animation:pls 1.4s ease-in-out infinite}
.shine{animation:shine 14s ease-in-out infinite alternate;mix-blend-mode:soft-light;pointer-events:none}
</style>
</head>
<body>
<div id="app">
<header><div id="top"></div><div id="sub"></div><div class="days" id="spd"></div><div id="bar"><i></i></div></header>
<main id="main"></main>
<div id="toast"></div>
<nav>
<button data-t="porto" onclick="go('porto')"><i>🏛</i><span>Porto</span></button>
<button data-t="mappa" onclick="go('mappa')"><i>🗺</i><span>Mappa</span></button>
<button data-t="navi" onclick="go('navi')"><i>⛵</i><span>Navi</span></button>

function autoStep(s){

}

function mktDay(cs){

 }

  pool.sort((a,b)=>r(b)-r(a));

 }

const SND={ctx:null,master:null,amb:null,nb:null};
function aud(){
 if(!OPT.snd)return null;
 try{
  if(!SND.ctx){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;SND.ctx=new AC();SND.master=SND.ctx.createGain();SND.master.connect(SND.ctx.destination)}
  if(SND.ctx.state==='suspended')SND.ctx.resume();
  SND.master.gain.value=OPT.vol;return SND.ctx;
 }catch(e){return null}
}
function nbuf(c){if(SND.nb)return SND.nb;const n=c.sampleRate*2,b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0);let l=0;for(let i=0;i<n;i++){l=(l+.02*(Math.random()*2-1))/1.02;d[i]=l*3.5}return SND.nb=b}
function envl(g,t,a,pk,dur){g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(pk,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+dur)}
function bellS(c,t,f,v,dur){[[1,1],[2.01,.6],[2.76,.45],[5.4,.25],[8.93,.12]].forEach(([m,a])=>{const o=c.createOscillator(),g=c.createGain();o.frequency.value=f*m;o.connect(g);g.connect(SND.master);envl(g,t,.005,v*a,dur/(1+m*.25));o.start(t);o.stop(t+dur)})}
function noiseS(c,t,dur,f0,f1,v){const s=c.createBufferSource();s.buffer=nbuf(c);s.loop=true;const fl=c.createBiquadFilter();fl.type='lowpass';fl.frequency.setValueAtTime(f0,t);fl.frequency.exponentialRampToValueAtTime(f1,t+dur);const g=c.createGain();s.connect(fl);fl.connect(g);g.connect(SND.master);envl(g,t,dur*.25,v,dur);s.start(t);s.stop(t+dur+.1)}
function thumpS(c,t,f,v,dur){const o=c.createOscillator(),g=c.createGain();o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*.4,t+dur);o.connect(g);g.connect(SND.master);envl(g,t,.01,v,dur);o.start(t);o.stop(t+dur+.05)}
const SFX={
 bell(c,t){bellS(c,t,520,.35,2.6);bellS(c,t+.5,520,.28,2.4)},
 fanfare(c,t){[392,494,587,784].forEach((f,k)=>bellS(c,t+k*.22,f,.25,2.2))},
 storm(c,t){noiseS(c,t,3.2,1400,200,.9);thumpS(c,t+.9,60,.7,1.6);thumpS(c,t+1.9,48,.6,1.8)},
 plague(c,t){[0,1.6].forEach(k=>bellS(c,t+k,170,.45,3.2));const o=c.createOscillator(),o2=c.createOscillator(),g=c.createGain(),fl=c.createBiquadFilter();o.type=o2.type='sawtooth';o.frequency.value=98;o2.frequency.value=103.8;fl.type='lowpass';fl.frequency.value=320;o.connect(fl);o2.connect(fl);fl.connect(g);g.connect(SND.master);envl(g,t,1,.18,3.6);o.start(t);o2.start(t);o.stop(t+3.7);o2.stop(t+3.7)},
 siege(c,t){[0,.55,1,1.6].forEach((k,i)=>{thumpS(c,t+k,i%2?80:110,.8,.5);noiseS(c,t+k,.45,2500,300,.5)})},
 waves(c,t){noiseS(c,t,3,700,250,.5)}
};

  if(want&&SND.ctx&&!SND.amb){
   const c=SND.ctx,s=c.createBufferSource();s.buffer=nbuf(c);s.loop=true;

   const lfo=c.createOscillator(),lg=c.createGain();lfo.frequency.value=.11;lg.gain.value=.07;lfo.connect(lg);lg.connect(g.gain);

function stormEvent(s){

 if(r<.6){const d=1+Math.floor(Math.random()*3);s.arr+=d;m=`Burrasca: la ${s.name} perde ${gg(d)} di viaggio.`}
 else if(r<.85){const x=6+Math.floor(Math.random()*11);s.hp=Math.max(5,hp(s)-x);m=`Tempesta: la ${s.name} riporta danni allo scafo (−${x}%).`}
 else if(tot(s.cargo)>0){const l=loseShare(s,.05+Math.random()*.07);m=l>0?`Mare grosso: la ${s.name} perde ${l} unità di carico in acqua.`:`Mare grosso: la ${s.name} se la cava senza danni.`}
 else{s.arr+=1;m=`Burrasca: la ${s.name} perde 1 giorno di viaggio.`}

function takeGood(c,i,q){
 let co=0,k=0;
 const d=S.dep[c],dcc=dc(c);
 while(k<q&&d[i]>0){const a=dcc[i]/d[i];co+=a;dcc[i]=Math.max(0,dcc[i]-a);d[i]--;k++}
 for(const s of S.ships)if(s.city===c&&!s.dest){const ca=cb(s);while(k<q&&s.cargo[i]>0){const a=ca[i]/s.cargo[i];co+=a;ca[i]=Math.max(0,ca[i]-a);s.cargo[i]--;k++}}
 return [k,co];
}

 const app=document.getElementById('app');if(!app)return;
 const w=window.innerWidth,h=window.innerHeight,o=OPT.orient;
 const rot=(o==='landscape'&&h>w)||(o==='portrait'&&w>h);
 const W=rot?h:w,H=rot?w:h,land=W>H;
 app.classList.toggle('land',land);app.dataset.rot=rot?'1':'';
 app.style.width=W+'px';app.style.height=H+'px';
 app.style.transformOrigin=rot?'0 0':'';
 app.style.transform=rot?(o==='landscape'?`translate(${w}px,0) rotate(90deg)`:`translate(0,${h}px) rotate(-90deg)`):'';
 app.style.setProperty('--mh',Math.round(H*.5)+'px');
 if(typeof fitMap==='function')fitMap();
}
function fitMap(){
 const mb=document.getElementById('mapbox');if(!mb)return;
 const svg=mb.querySelector('svg');if(!svg)return;
 const z=S.ui.mz||2,land=document.getElementById('app').classList.contains('land');
 const bw=mb.clientWidth,bh=mb.clientHeight;
 const base=land&&bh>0?Math.min(bw,bh*MAPW/MAPH):bw;
 svg.style.width=Math.max(60,Math.round(base*z))+'px';
}
function lockOrient(){
 try{
  if(!screen.orientation||!screen.orientation.lock)return;
  if(document.fullscreenElement&&OPT.orient!=='auto')screen.orientation.lock(OPT.orient).catch(()=>{});
  else if(screen.orientation.unlock)screen.orientation.unlock();
 }catch(e){}
}
function setOrient(o){
 OPT.orient=o;saveOpt();lockOrient();
 applyLayout();mapScroll=null;render();toast(o==='auto'?'Orientamento automatico':o==='portrait'?'Schermo in verticale':'Schermo in orizzontale');
}
function toggleFS(){
 try{
  if(document.fullscreenElement)document.exitFullscreen();
  else if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(()=>toast('Schermo intero non disponibile'));
  else toast('Schermo intero non disponibile');
 }catch(e){toast('Schermo intero non disponibile')}
}
window.addEventListener('resize',()=>{applyLayout();mapScroll=null;if(S&&S.ui&&S.ui.tab==='mappa')render()});
window.addEventListener('orientationchange',()=>setTimeout(()=>{applyLayout();mapScroll=null;render()},120));
document.addEventListener('fullscreenchange',()=>{lockOrient();if(S.ui.tab==='opzioni')render()});
function renderTop(){$('#top').innerHTML=(VIEW==='game'?`<span>Giorno ${S.day}</span><span>${fmt(S.gold)} ₯</span>`:'<span>Mercanti del Mediterraneo</span>')+'<button class="gear" onclick="go(\'opzioni\')" aria-label="Opzioni">⚙</button>';$('#sub').innerHTML=VIEW==='game'?`${S.name}, ${RANKS[S.rank][0]}${S.debt?' · debito '+fmt(S.debt)+' ₯':''} · ${SN[seas()]}${Object.keys(S.war).length?' · ⚔ guerra':''}`:''}
function renderSpeed(){
 $('#spd').innerHTML=[['Pausa',0],['1X',1],['2X',2],['4X',4]].map(([l,v])=>`<button class="${speed===v?'on':''}" onclick="setSpeed(${v})">${l}</button>`).join('');
}
function navDots(){
 const d={};
 if(S.ui.arrived)d.navi=1;
 if(S.log[0]&&S.log[0]!==S.ui.seenLog)d.diario=1;
 if(Object.keys(S.crisis||{}).some(c=>S.crisis[c])||Object.keys(S.siege||{}).length)d.citta=1;
 return d;
}
function render(keep){
 const u=S.ui;
 document.body.classList.toggle('start',VIEW!=='game');
 renderTop();renderSpeed();
 const nd=VIEW==='game'?navDots():{};
 document.querySelectorAll('nav button').forEach(b=>{b.classList.toggle('on',b.dataset.t===u.tab);const o=b.querySelector('.dot');if(o)o.remove();if(nd[b.dataset.t]&&b.dataset.t!==u.tab){const e=document.createElement('b');e.className='dot';b.appendChild(e)}});
 const sv=[...document.querySelectorAll('#main select')].map(s=>s.value);
 const mb=document.getElementById('mapbox');if(mb)mapScroll=[mb.scrollLeft,mb.scrollTop];
 $('#main').innerHTML=VIEW==='menu'?P.menu():VIEW==='opz'?P.opzioni():VIEW==='guida'?P.guida():VIEW==='new'?P.inizio():(u.tab==='opzioni'?P.opzioni():P[u.tab]());
 ambUpdate();fitMap();
 const mb2=document.getElementById('mapbox');if(mb2){if(mapScroll===null){if(mapFocusPt){mapCenterXY(mapFocusPt[0],mapFocusPt[1]);mapFocusPt=null}else mapCenter(S.ui.mapSel||(S.ships[0]&&S.ships[0].city)||S.home)}else{mb2.scrollLeft=mapScroll[0];mb2.scrollTop=mapScroll[1]}}
 if(keep)[...document.querySelectorAll('#main select')].forEach((s,i)=>{if(sv[i]!==undefined&&[...s.options].some(o=>o.value===sv[i]||o.text===sv[i]))s.value=sv[i]});
}
{const _p=P.porto,_d=P.diario;
 const _i=P.imprese,_c=P.citta;
 P.guida=guideCard;P.stat=statPage;
 P.porto=function(){return tutoCard()+goalCard()+advice(S.ui.city)+_p()+questCard(S.ui.city)};
 P.diario=function(){return `<div class="b"><button onclick="go('stat')">📊 Statistiche e classifica</button></div>`+goalList()+evList()+questList()+_d()};
 P.imprese=function(){return _i()+ordCard()};
 P.citta=function(){return _c()+evList(S.ui.city)};}
applyLayout();render();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
